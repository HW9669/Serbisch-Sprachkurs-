<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serbisch für Anfänger</title>
<meta name="description" content="Serbisch lernen in lateinischer Schrift mit Ton: Wörter, 100 Alltagssätze, Quiz und Hörübungen mit Lautschrift für österreichisches Deutsch.">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1b2230;
    --muted: #596273;
    --line: #dadfe7;
    --accent: #1b4fd1;
    --accent-ink: #ffffff;
    --good: #19764a;
    --good-bg: #e3f3ea;
    --bad: #b3261e;
    --bad-bg: #fae6e4;
    --note-bg: #fff4d6;
    --note-ink: #5c4300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1b2029; --text: #e8ebf1; --muted: #9ba4b3;
      --line: #2c3340; --accent: #7099ff; --accent-ink: #0b1220;
      --good: #6fd29b; --good-bg: #17301f; --bad: #ff8d84; --bad-bg: #3a1c1a;
      --note-bg: #3a3014; --note-ink: #f1d98a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #1b2029; --text: #e8ebf1; --muted: #9ba4b3;
    --line: #2c3340; --accent: #7099ff; --accent-ink: #0b1220;
    --good: #6fd29b; --good-bg: #17301f; --bad: #ff8d84; --bad-bg: #3a1c1a;
    --note-bg: #3a3014; --note-ink: #f1d98a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header, main {
    max-width: 780px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { padding-top: 18px; padding-bottom: 14px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .brand { flex: 1; min-width: 0; }
  h1 { font-size: 1.4rem; margin: 0; line-height: 1.2; text-wrap: balance; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  h2.grp { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }
  .btn, select, input[type="search"] {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 44px;
  }
  input[type="search"] { cursor: text; min-width: 0; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  .btn.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .btn.ear { min-height: 38px; padding: 5px 14px; color: var(--accent); border-color: var(--accent); }
  .btn:disabled { cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { padding-bottom: 56px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .row .grow { flex: 1 1 200px; min-width: 0; }
  .chk { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .chk input { width: 20px; height: 20px; }
  .muted { color: var(--muted); }
  .note { background: var(--note-bg); color: var(--note-ink); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; }
  .note .btn { margin-left: 6px; min-height: 36px; padding: 4px 12px; }

  /* Hauptmenü */
  .path ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: s; }
  .path li { display: grid; grid-template-columns: 1.4em 1fr; column-gap: 6px; counter-increment: s; }
  .path li .muted { grid-column: 2; font-size: .88rem; }
  .path li::before { content: counter(s); font-weight: 700; color: var(--accent); padding-top: 4px; }
  .link { font: inherit; background: none; border: 0; padding: 4px 0; color: var(--accent); cursor: pointer; text-align: left; font-weight: 600; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .item {
    display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; min-width: 0;
  }
  .item:hover { border-color: var(--accent); }
  .item .t { font-weight: 700; font-size: 1.05rem; }
  .item .d { color: var(--muted); font-size: .92rem; }
  .item .m { color: var(--accent); font-size: .88rem; font-weight: 600; margin-top: 4px; }

  .next h2 { font-size: 1.3rem; margin: 2px 0 4px; }
  .next p { margin: 0 0 12px; }
  .lnum {
    display: inline-block; min-width: 1.7em; text-align: center; margin-right: 4px; padding: 0 4px;
    border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-variant-numeric: tabular-nums;
  }

  /* Lektion: Schritte */
  .steps { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
  .step {
    display: grid; grid-template-columns: 2.2em 1fr; column-gap: 10px; align-items: center; width: 100%;
    text-align: left; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
  }
  .step:hover { border-color: var(--accent); }
  .step .no {
    grid-row: span 2; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--line); font-weight: 700; color: var(--muted);
  }
  .step.done .no { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .step .lbl { font-weight: 650; }
  .step .inf { color: var(--muted); font-size: .9rem; grid-column: 2; }

  /* Dialog */
  .dlg { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .dlg li { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); display: grid; gap: 2px; justify-items: start; }
  .dlg li.p1 { margin-left: 12%; }
  .dlg li.p0 { margin-right: 12%; }
  .dlg li.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .dlg .who { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  .dlg .sr { font-weight: 650; font-size: 1.1rem; }
  .qtype { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .fb-line { margin: 4px 0; }


  /* Dialog-Steuerung */
  .dbar {
    position: sticky; bottom: 0; margin-top: 14px; display: grid; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 14px rgba(0, 0, 0, .12);
  }
  .drow { display: flex; gap: 8px; flex-wrap: wrap; }
  .drow .btn { flex: 1 1 90px; }
  .drow.small { align-items: center; font-size: .9rem; color: var(--muted); }
  .drow.small label { display: flex; gap: 6px; align-items: center; }
  .drow.small select { min-height: 36px; padding: 4px 8px; }
  .dlg li .your { display: none; color: var(--good); font-weight: 650; font-size: .9rem; }
  .dlg li.wait .your { display: block; }
  .dlg li.wait { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); }
  .dlg li { scroll-margin-top: 90px; cursor: pointer; }
  .dopt summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 4px 0; }
  .dopt .drow.small { margin-top: 6px; }
  .tick { display: grid; place-items: center; min-width: 44px; min-height: 44px; }
  .tick input { width: 22px; height: 22px; }

  /* Karteikarte & Quiz */
  .card {
    min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px; padding: 24px 12px; border: 1px dashed var(--line); border-radius: 12px; cursor: default;
    user-select: none; margin-top: 8px;
  }
  .card .big { font-size: 2.1rem; font-weight: 650; overflow-wrap: anywhere; }
  .card .big.sent, .q.sent { font-size: 1.5rem; }
  .pron { color: var(--accent); font-size: 1.15rem; }
  .trans { font-size: 1.4rem; overflow-wrap: anywhere; }
  .trans.sent { font-size: 1.15rem; }
  .hint { color: var(--muted); font-size: .88rem; }
  .q { font-size: 1.9rem; font-weight: 650; margin: 8px 0 2px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 12px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .opts { display: grid; gap: 8px; margin-top: 14px; }
  .opts .btn { text-align: left; }
  .opts .btn.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opts .btn.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .fb { margin: 14px 0 4px; font-size: 1.05rem; }
  .fb.ok { color: var(--good); }
  .fb.no { color: var(--bad); }

  /* Listen */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list > li > div { min-width: 0; overflow-wrap: anywhere; }
  .list .sr { font-weight: 650; }
  .list .pr { color: var(--accent); font-size: .95rem; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { border-radius: 99px; padding: 4px 12px; font-size: .9rem; min-height: 36px; }
  [aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg { display: flex; gap: 6px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 480px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  td:first-child { font-weight: 700; font-size: 1.1rem; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { .card .big { font-size: 1.7rem; } .q { font-size: 1.6rem; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="btn" id="back" hidden>← Menü</button>
    <div class="brand">
      <h1>Serbisch für Anfänger</h1>
      <p class="sub" id="crumb"></p>
    </div>
    <button class="btn" id="gear" aria-label="Einstellungen">Optionen</button>
  </div>
</header>
<main id="app"></main>
<script src="data.js"></script>
<script src="ch-a.js"></script>
<script src="ch-b.js"></script>
<script src="ch-c.js"></script>
<script src="ch-d.js"></script>
<script src="app.js"></script>
</body>
</html>
