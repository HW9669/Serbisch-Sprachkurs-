<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serbisch für Anfänger</title>
<meta name="description" content="Serbisch lernen in lateinischer Schrift: Wortschatz-Trainer, Vokabelquiz und die 100 wichtigsten Alltagssätze mit österreichischer Lautschrift.">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1c2330;
    --muted: #5d6676;
    --line: #dde1e8;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --good: #1c7c4a;
    --good-bg: #e4f4ea;
    --bad: #b3261e;
    --bad-bg: #fbe7e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1b2029; --text: #e8ebf1; --muted: #9aa3b2;
      --line: #2c3340; --accent: #6b93ff; --accent-ink: #0c1220;
      --good: #6fd29b; --good-bg: #17301f; --bad: #ff8d84; --bad-bg: #3a1c1a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #1b2029; --text: #e8ebf1; --muted: #9aa3b2;
    --line: #2c3340; --accent: #6b93ff; --accent-ink: #0c1220;
    --good: #6fd29b; --good-bg: #17301f; --bad: #ff8d84; --bad-bg: #3a1c1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  nav button, .btn, select, input[type="search"] {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  nav button[aria-selected="true"], .btn.primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .btn.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  .btn.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { padding-bottom: 48px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .row .grow { flex: 1 1 160px; }
  .muted { color: var(--muted); }
  .card {
    min-height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 6px; padding: 24px 12px; border: 1px dashed var(--line); border-radius: 12px; cursor: pointer;
    user-select: none;
  }
  .card .big { font-size: 2rem; font-weight: 650; overflow-wrap: anywhere; }
  .card .pron { color: var(--accent); font-size: 1.15rem; }
  .card .hint { color: var(--muted); font-size: .9rem; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .opts { display: grid; gap: 8px; margin-top: 12px; }
  .opts button { text-align: left; }
  .opts button.right { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opts button.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list .sr { font-weight: 650; }
  .list .pr { color: var(--accent); font-size: .95rem; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { border-radius: 99px; padding: 4px 12px; font-size: .9rem; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  td:first-child { font-weight: 700; font-size: 1.1rem; }
  .icon { padding: 4px 10px; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { .card .big { font-size: 1.6rem; } }
</style>
</head>
<body>
<header>
  <h1>Serbisch für Anfänger</h1>
  <p class="sub">Lateinische Schrift · Lautschrift für österreichisches Deutsch · Betonung in GROSSBUCHSTABEN</p>
  <nav role="tablist" aria-label="Bereiche">
    <button role="tab" data-tab="trainer" aria-selected="true">Wortschatz-Trainer</button>
    <button role="tab" data-tab="quiz" aria-selected="false">Vokabelquiz</button>
    <button role="tab" data-tab="sentences" aria-selected="false">100 Sätze</button>
    <button role="tab" data-tab="sounds" aria-selected="false">Aussprache</button>
  </nav>
</header>
<main id="app"></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
